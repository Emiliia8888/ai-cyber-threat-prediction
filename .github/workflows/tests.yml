name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cyber_threats
          POSTGRES_USER: cyber_user
          POSTGRES_PASSWORD: cyber_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U cyber_user -d cyber_threats"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database schema
        run: |
          PGPASSWORD=cyber_password psql \
            -h localhost \
            -p 5433 \
            -U cyber_user \
            -d cyber_threats \
            -f src/infrastructure/persistence/sql/001_create_events.sql

      - name: Run tests
        run: python -m pytest
